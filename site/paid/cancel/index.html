<!doctype html>
<html lang="zh-Hant">
<head>

<title>沒有付款 · JarvisVoice</title>
<link rel="icon" href="../../favicon.png">
<style>
  :root { --bg: #fbfaf8; --text: #18181b; --muted: #5b5b63; --accent: #2f54d9; --icon-filter: none; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111214; --text: #ececee; --muted: #a3a3ab; --accent: #8ea4ff; --icon-filter: invert(1); } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.7 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: 72px 16px; }
  img { width: 56px; height: 56px; filter: var(--icon-filter); }
  h1 { font-size: 26px; margin: 20px 0 8px; }
  p { margin: 8px 0; color: var(--muted); }
  hr { border: 0; border-top: 1px solid color-mix(in srgb, var(--muted) 30%, transparent); margin: 32px 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="../../icon.png" alt="JarvisVoice">
  <h1>沒有付款</h1>
  <p>這次沒有扣款。想買點數的話，從選單列 JarvisVoice 的「購買點數…」再來一次。</p>
  <hr>
  <h1 lang="en">No payment was made</h1>
  <p lang="en">You weren’t charged. To buy credits, choose “Buy credits…” in the JarvisVoice menu bar menu again.</p>
